_target_: diffusion_policy.workspace.train_samp_lowdim_workspace.TrainSampLowdimWorkspace

action_dim: 20
obs_dim: 59
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_as_global_cond: true
obs_as_local_cond: false
pred_action_steps_only: false
oa_step_convention: true

task_semantics:
  domain: robomimic
  task_name: transport_ph
  control_mode: abs_dual_eef_pose
  action_representation: dual_xyz_rotation6d_gripper
  action_groups:
    robot0_translation: [0, 1, 2]
    robot0_rotation: [3, 4, 5, 6, 7, 8]
    robot0_gripper: [9]
    robot1_translation: [10, 11, 12]
    robot1_rotation: [13, 14, 15, 16, 17, 18]
    robot1_gripper: [19]
  routing:
    spectral: [0, 1, 2, 10, 11, 12]
    direct: [3, 4, 5, 6, 7, 8, 9, 13, 14, 15, 16, 17, 18, 19]
  diagnostics:
    smooth_groups:
      robot0_xyz: [0, 1, 2]
      robot1_xyz: [10, 11, 12]
    rotation_groups:
      robot0_rotation: [3, 4, 5, 6, 7, 8]
      robot1_rotation: [13, 14, 15, 16, 17, 18]
    contact_groups:
      robot0_gripper: [9]
      robot1_gripper: [19]

data_split:
  val_ratio: 0.02
  seed: 42
  max_train_episodes: null

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

dataloader:
  batch_size: 128
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 128
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: false

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

exp_name: default

logging:
  group: null
  id: null
  mode: offline
  project: samp_diff_robomimic_v2c
  entity: null
  name: samp_diff_transport_ph_v2c_step6
  resume: true
  tags: [samp_lowdim, robomimic, transport, ph, dual_arm, v2c_step6]

multi_run:
  run_dir: data/outputs/robomimic/transport_ph
  wandb_name_base: samp_diff_transport_ph_v2c_step6

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.95, 0.999]
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06

training:
  device: cuda:0
  seed: ${data_split.seed}
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 6000
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

policy:
  _target_: diffusion_policy.policy.samp_lowdim_policy.SampLowdimPolicy
  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: ${obs_as_global_cond}
  obs_as_local_cond: ${obs_as_local_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: ${oa_step_convention}
  encoder_embed_dim: 512
  decoder_embed_dim: 512
  encoder_depth: 6
  decoder_depth: 6
  encoder_num_heads: 8
  decoder_num_heads: 8
  mask: true
  num_iter: 4
  num_inference_steps: 6
  fm_sigma: 0.0
  sigma: 0.3
  cold_start_prob: 0.3
  freq_split_low: 0
  freq_split_high: 8
  sigma_high: 0.2
  action_group_spectral_params:
    translation:
      indices: [0, 1, 2, 10, 11, 12]
      freq_split_high: 8
      sigma: 0.3
      sigma_high: 0.2
    rotation:
      indices: [3, 4, 5, 6, 7, 8, 13, 14, 15, 16, 17, 18]
      freq_split_high: 12
      sigma: 0.25
      sigma_high: 0.3
    gripper:
      indices: [9, 19]
      freq_split_high: 16
      sigma: 0.5
      sigma_high: 0.5

task:
  abs_action: true
  action_dim: ${action_dim}
  dataset_path: data/robomimic/datasets/transport/ph/low_dim_abs.hdf5
  dataset_type: ph
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_lowdim_dataset.RobomimicReplayLowdimDataset
    abs_action: true
    dataset_path: ${task.dataset_path}
    horizon: ${horizon}
    obs_keys: [object, robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, robot1_eef_pos, robot1_eef_quat, robot1_gripper_qpos]
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: ${data_split.seed}
    val_ratio: ${data_split.val_ratio}
    max_train_episodes: ${data_split.max_train_episodes}
    use_legacy_normalizer: false
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_lowdim_runner.RobomimicLowdimRunner
    abs_action: true
    crf: 22
    dataset_path: ${task.dataset_path}
    fps: 10
    max_steps: 700
    n_action_steps: ${n_action_steps}
    n_envs: 28
    n_latency_steps: ${n_latency_steps}
    n_obs_steps: ${n_obs_steps}
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    obs_keys: [object, robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, robot1_eef_pos, robot1_eef_quat, robot1_gripper_qpos]
    past_action: false
    render_hw: [128, 128]
    test_start_seed: 100000
    train_start_idx: 0
    output_dir: ${hydra:runtime.output_dir}
