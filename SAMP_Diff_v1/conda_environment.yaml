name: robodiff310
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=22.2.2
  - setuptools=65.5.0
  - wheel
  # H100 note:
  # Install torch/torchvision after env creation with an explicit CUDA wheel.
  # Keeping torch out of this file avoids accidental cu130 installs from pip
  # dependencies and avoids older CUDA 11.x wheels on H100.
  # Recommended after activation:
  # pip install torch==2.3.1+cu121 torchvision==0.18.1+cu121 \
  #   --index-url https://download.pytorch.org/whl/cu121
  # pytorch3d is not required for low-dim PushT/RoboMimic training.
  # - pytorch3d=0.7.0
  - numpy=1.23.3
  - numba==0.56.4
  - scipy==1.9.1
  - py-opencv=4.6.0
  - cffi=1.15.1
  - ipykernel=6.16
  - matplotlib=3.6.1
  - zarr=2.12.0
  - numcodecs=0.10.2
  - h5py=3.7.0
  - hydra-core=1.2.0
  - einops=0.4.1
  - tqdm=4.64.1
  - dill=0.3.5.1
  - scikit-video=1.1.11
  - scikit-image=0.19.3
  - gym=0.21.0
  - pymunk=6.2.1
  - wandb=0.13.3
  - threadpoolctl=3.1.0
  - shapely=1.8.4
  - cython=0.29.32
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - termcolor=2.0.1
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - psutil=5.9.2
  - click=8.0.4
  - boto3=1.24.96
  - accelerate=0.13.2
  - datasets=2.6.1
  - diffusers=0.11.1
  - av=10.0.0
  - cmake=3.24.3
  # trick to avoid cpu affinity issue described in https://github.com/pytorch/pytorch/issues/99625
  - llvm-openmp=14
  # trick to force reinstall imagecodecs via pip
  - imagecodecs==2022.8.8
  - pip:
    - ray[default,tune]==2.2.0
    # MuJoCo / simulator extras are intentionally disabled for the first
    # train-only environment. Install them later only when eval is needed.
    # Install free-mujoco-py only after MUJOCO_PATH is configured.
    # It can fail during env creation with:
    # RuntimeError: MUJOCO_PATH environment variable is not set
    # - free-mujoco-py==2.1.6
    - pygame==2.1.2
    # pybullet-svl is not needed for PushT / RoboMimic low-dim runs.
    # It may fail during setup if setuptools/pkg_resources is missing.
    # - pybullet-svl==3.1.6.4
    # Install robosuite after env creation with --no-deps. Its legacy
    # dependency pin asks for numba<=0.53.1, which is incompatible with
    # Python 3.10 even though this code path works with numba 0.56.4.
    # - robosuite @ https://github.com/cheng-chi/robosuite/archive/277ab9588ad7a4f4b55cf75508b44aa67ec171f0.tar.gz
    - robomimic==0.2.0
    # pytorchvideo can pull torch during pip resolution; install later if
    # image/video policy code needs it.
    # - pytorchvideo==0.1.5
    # pip package required for jpeg-xl
    - imagecodecs==2022.9.26
    # r3m is image-policy related and not needed for current low-dim runs.
    # - r3m @ https://github.com/facebookresearch/r3m/archive/b2334e726887fa0206962d7984c69c5fb09cceab.tar.gz
    # dm-control may pull MuJoCo dependencies; install later if needed.
    # - dm-control==1.0.9
    # Install these after torch with --no-deps, otherwise torchcfm may upgrade
    # torch to a CUDA build that is newer than the node driver supports.
    # - torchcfm
    # - torch-dct
